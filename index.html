<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Rishit Modi — AI/ML Engineer &amp; Full-Stack Builder. Portfolio showcasing projects in cryptography, deep learning, and scalable product engineering." />
    <meta name="keywords" content="Rishit Modi, AI/ML Engineer, Full-Stack Developer, Software Engineer, Portfolio, Cryptography, Deep Learning, React, Spring Boot, Python" />
    <meta name="author" content="Rishit Modi" />
    <meta name="theme-color" content="#f4f8f6" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#0c1311' : '#f4f8f6');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph / Facebook -->
